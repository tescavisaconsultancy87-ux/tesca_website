name: Supabase to Cloudflare R2 Automated Backup

on:
  schedule:
    # Runs every day at 02:00 UTC (07:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allows manual backup trigger from GitHub Actions UI anytime
    inputs:
      retention_days:
        description: 'Days of backups to retain in R2'
        required: false
        default: '30'

jobs:
  backup:
    name: Backup Supabase DB to Cloudflare R2
    runs-on: ubuntu-latest

    steps:
      - name: Generate Database Backup (PostgreSQL 17)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set!"
            exit 1
          fi

          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          BACKUP_FILE="supabase_backup_${TIMESTAMP}.sql.gz"

          echo "Starting database dump using PostgreSQL 17..."
          docker run --rm \
            postgres:17-alpine \
            pg_dump "$SUPABASE_DB_URL" \
              --clean \
              --if-exists \
              --no-owner \
              --no-privileges | gzip > "$BACKUP_FILE"

          FILESIZE=$(stat -c%s "$BACKUP_FILE" 2>/dev/null || stat -f%z "$BACKUP_FILE")
          echo "Backup completed: $BACKUP_FILE ($FILESIZE bytes)"

          if [ "$FILESIZE" -lt 100 ]; then
            echo "::error::Backup file is suspiciously small ($FILESIZE bytes). Check DB connection."
            exit 1
          fi

          echo "BACKUP_FILE=$BACKUP_FILE" >> $GITHUB_ENV
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV

      - name: Upload Backup to Cloudflare R2
        env:
          RAW_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          RAW_SECRET_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RAW_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          RAW_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          # Install rclone
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone

          # Sanitize secrets
          R2_ACCESS_KEY=$(echo "$RAW_ACCESS_KEY" | tr -d '[:space:]')
          R2_SECRET_KEY=$(echo "$RAW_SECRET_KEY" | tr -d '[:space:]')
          R2_ACCOUNT_ID=$(echo "$RAW_ACCOUNT_ID" | tr -d '[:space:]')
          R2_BUCKET_NAME=$(echo "$RAW_BUCKET_NAME" | tr -d '[:space:]')

          if [ -z "$R2_ACCESS_KEY" ] || [ -z "$R2_SECRET_KEY" ] || [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_BUCKET_NAME" ]; then
            echo "::error::One or more R2 secrets are missing in GitHub repository settings!"
            exit 1
          fi

          # Create explicit rclone config using printf (guarantees perfect YAML syntax and indentation)
          mkdir -p ~/.config/rclone
          printf "[r2]\ntype = s3\nprovider = Cloudflare\naccess_key_id = %s\nsecret_access_key = %s\nendpoint = https://%s.r2.cloudflarestorage.com\nno_check_bucket = true\nforce_path_style = true\n" "$R2_ACCESS_KEY" "$R2_SECRET_KEY" "$R2_ACCOUNT_ID" > ~/.config/rclone/rclone.conf

          echo "Uploading $BACKUP_FILE to Cloudflare R2 bucket: $R2_BUCKET_NAME/database/..."
          rclone copyto "$BACKUP_FILE" "r2:${R2_BUCKET_NAME}/database/${BACKUP_FILE}" --s3-no-check-bucket -v

          echo "Upload complete! Verifying file in R2:"
          rclone lsf "r2:${R2_BUCKET_NAME}/database" --s3-no-check-bucket
